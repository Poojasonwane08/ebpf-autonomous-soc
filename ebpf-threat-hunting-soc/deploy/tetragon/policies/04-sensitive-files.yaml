# Reads/writes of credential stores, SSH keys and cron (credential access / persistence).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: soc-sensitive-files
spec:
  kprobes:
  - call: "security_file_permission"
    syscall: false
    return: true
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int"
    returnArg:
      index: 0
      type: "int"
    returnArgAction: "Post"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/etc/shadow"
        - "/etc/gshadow"
        - "/etc/sudoers"
        - "/root/.ssh"
        - "/home"
        - "/var/www/.ssh"
        - "/etc/cron"
        - "/var/spool/cron"
