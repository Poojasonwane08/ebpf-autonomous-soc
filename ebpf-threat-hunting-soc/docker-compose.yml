# eBPF Autonomous Threat Hunting SOC - full stack (works on Windows via Docker Desktop)
#
#   docker compose up --build        then open http://localhost:8080
#
# kafka      Apache Kafka 3.8 (KRaft, single node) - telemetry streaming backbone
# sensor     simulated fleet of 5 Linux servers emitting Tetragon-format eBPF events
# engine     normalizer + CEP / detection engine (Sigma, behaviour, ML) + SOAR
# dashboard  SOC investigation dashboard + REST API on :8080

x-soc: &soc
  build: .
  image: ebpf-soc:latest
  restart: unless-stopped
  environment: &socenv
    SOC_BUS: kafka
    KAFKA_BOOTSTRAP: kafka:9092
    RESPONSE_MODE: ${RESPONSE_MODE:-autonomous}
    BACKGROUND_EPS: ${BACKGROUND_EPS:-25}
    SOAR_WEBHOOK_URL: ${SOAR_WEBHOOK_URL:-}
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: soc-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  engine:
    <<: *soc
    container_name: soc-engine
    command: ["python", "-m", "soc.service", "engine"]

  sensor:
    <<: *soc
    container_name: soc-sensor
    command: ["python", "-m", "soc.service", "sensor"]
    environment:
      <<: *socenv
      SENSOR_MODE: simulate

  dashboard:
    <<: *soc
    container_name: soc-dashboard
    command: ["python", "-m", "soc.service", "dashboard"]
    ports:
      - "8080:8080"
    volumes:
      - ./evidence:/app/evidence
