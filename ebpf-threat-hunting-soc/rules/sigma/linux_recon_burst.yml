title: Linux System Discovery Commands
id: 6f0a1c2e-3d1b-4b8e-9a51-0c1f7e2a9b02
status: stable
description: Execution of typical post-exploitation discovery binaries by a non-root user or a service account.
author: eBPF SOC
logsource:
  product: linux
  category: process_creation
detection:
  recon:
    Image|endswith: ['/whoami', '/id', '/uname', '/hostname', '/ifconfig', '/ip', '/netstat', '/ss']
  passwd:
    CommandLine|contains: '/etc/passwd'
  root:
    User: 0
  condition: (recon or passwd) and not root
falsepositives: [Admin troubleshooting]
level: low
tags: [attack.discovery, attack.t1033, attack.t1082, attack.t1087.001]
