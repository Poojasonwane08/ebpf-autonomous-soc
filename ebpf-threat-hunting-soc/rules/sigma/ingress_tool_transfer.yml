title: Download of Payload to Temp / Pipe-to-Shell
id: 6f0a1c2e-3d1b-4b8e-9a51-0c1f7e2a9b05
status: stable
description: curl / wget used to fetch a payload into /tmp or /dev/shm, or piped directly into a shell.
author: eBPF SOC
logsource:
  product: linux
  category: process_creation
detection:
  tool:
    Image|endswith: ['/curl', '/wget']
  dest:
    CommandLine|contains: [' -o /tmp', ' -O /tmp', '/dev/shm', '| sh', '|sh', '| bash', '|bash']
  condition: tool and dest
level: high
tags: [attack.command_and_control, attack.t1105]
