title: Unexpected Privilege Escalation to Root (commit_creds)
id: 6f0a1c2e-3d1b-4b8e-9a51-0c1f7e2a9b09
status: stable
description: The kernel commit_creds() hook shows a non-root process becoming uid 0 outside of sudo/su/login paths - kernel or SUID exploit.
author: eBPF SOC
logsource:
  product: linux
  category: privilege_change
detection:
  to_root:
    NewUid: 0
  from_user:
    User|gt: 0
  legit:
    Image|endswith: ['/sudo', '/su', '/sshd', '/login', '/cron', '/systemd', '/polkitd', '/newgrp', '/unix_chkpwd']
  condition: to_root and from_user and not legit
level: critical
tags: [attack.privilege_escalation, attack.t1068]
