title: Fileless Execution from memfd / /proc/self/fd / /dev/shm
id: 6f0a1c2e-3d1b-4b8e-9a51-0c1f7e2a9b06
status: stable
description: A binary was executed from an anonymous memory file descriptor or tmpfs - fileless malware that never touches disk.
author: eBPF SOC
logsource:
  product: linux
  category: process_creation
detection:
  memexec:
    Image|re: '^(/proc/(self|[0-9]+)/fd/[0-9]+|/dev/shm/|memfd:)'
  condition: memexec
level: critical
tags: [attack.defense_evasion, attack.t1620]
