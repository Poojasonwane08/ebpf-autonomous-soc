title: Ptrace Process Injection
id: 6f0a1c2e-3d1b-4b8e-9a51-0c1f7e2a9b08
status: stable
description: ptrace ATTACH / POKETEXT / POKEDATA against another process - memory injection technique.
author: eBPF SOC
logsource:
  product: linux
  category: process_access
detection:
  inject:
    PtraceRequest: ['PTRACE_ATTACH', 'PTRACE_SEIZE', 'PTRACE_POKETEXT', 'PTRACE_POKEDATA', 'PTRACE_SETREGS']
  debuggers:
    Image|endswith: ['/gdb', '/strace', '/ltrace', '/lldb']
  condition: inject and not debuggers
level: critical
tags: [attack.defense_evasion, attack.privilege_escalation, attack.t1055.008]
