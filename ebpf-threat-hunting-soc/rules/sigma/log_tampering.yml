title: Linux Log or History Tampering
id: 6f0a1c2e-3d1b-4b8e-9a51-0c1f7e2a9b15
status: stable
description: Deleting / shredding logs or wiping shell history to hide tracks.
author: eBPF SOC
logsource:
  product: linux
  category: process_creation
detection:
  sel:
    CommandLine|re: '(shred|rm|truncate)\s.*(/var/log/|\.bash_history)|history -c|unset HISTFILE'
  condition: sel
level: high
tags: [attack.defense_evasion, attack.t1070.002]
